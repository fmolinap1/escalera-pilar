<html lang="es">
<head>
<meta charset="UTF-8">

<title>Escalera Pilar · Tenis</title>
<style>

  .rank-n{font-family:var(--serif);font-weight:800;color:var(--gold-d);width:22px;text-align:center;flex-shrink:0}
  .scrolllist{max-height:300px;overflow-y:auto}
  .post{padding:13px 14px;border-bottom:1px solid var(--line)} .post:last-child{border-bottom:none}
  .post-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .post-ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .post-ico.res{background:#e7f1ea} .post-ico.chal{background:#f1eaf6}
  .post-body{flex:1;min-width:0;font-size:13.5px;line-height:1.45} .post-body b{font-family:var(--serif)}
  .post-when{font-size:10.5px;color:var(--muted);margin-top:1px}
  .post-score{font-family:var(--serif);font-weight:800;font-size:13px;color:var(--green-d);background:var(--cream);padding:3px 8px;border-radius:5px;border:1px solid var(--line);flex-shrink:0}

  .comments{margin:8px 0 0 44px;display:flex;flex-direction:column;gap:5px}
  .comment{font-size:12px;line-height:1.4;background:var(--cream);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
  .reg h4{font-family:var(--serif);font-size:14.5px;color:var(--green-d);margin:16px 0 6px} .reg h4:first-child{margin-top:2px}
  .reg p{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:5px}
  .reg .lead{color:var(--muted);font-size:12.5px;font-style:italic;margin-bottom:6px;font-family:var(--serif)}
  .cat-legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0} .cat-legend span{font-size:10.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:4px}
  #modal{position:absolute;inset:0;z-index:60;background:rgba(0,30,15,.5);display:flex;align-items:flex-end;justify-content:center}
  #modal .sheet{background:var(--card);width:100%;max-width:430px;border-radius:14px 14px 0 0;padding:22px 20px 28px;border-top:3px solid var(--gold);max-height:90vh;overflow-y:auto}
  .sheet h3{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:6px}
  .sheet p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:16px}
  .sheet .opt{display:flex;gap:10px;flex-wrap:wrap}
  .sheet label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:4px}
  .sheet input,.sheet textarea,.sheet select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:15px;margin-bottom:14px;font-family:inherit}
  .sheet input.score{text-align:center;font-size:18px;font-family:var(--serif);font-weight:700;letter-spacing:2px}
  .sheet textarea{min-height:70px;resize:none}
  .divider{border:none;border-top:1px solid var(--line);margin:4px 0 14px}
  .toast{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);background:var(--green-dd);color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:70;max-width:88%;text-align:center;border:1px solid var(--gold)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--cream);color:var(--gold-d);font-size:11px;font-weight:700;padding:3px 9px;border-radius:4px;border:1px solid var(--line)}
  .admin-req{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)} .admin-req:last-child{border-bottom:none}
  .admin-req .ai{flex:1} .admin-req .ai b{font-size:14px} .admin-req .ai div{font-size:11.5px;color:var(--muted)}
  .mini{border:none;font-size:12px;font-weight:700;padding:7px 11px;border-radius:6px;cursor:pointer} .mini.ok{background:var(--green);color:#fff}
  .reglink{width:100%;background:var(--card);color:var(--green-d);border:1.5px solid var(--line);padding:13px;border-radius:8px;font-size:14px;font-weight:700;font-family:var(--serif);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
  .appfoot{margin:20px 6px 6px;text-align:center;color:var(--muted);font-size:11px;line-height:1.55;border-top:1px solid var(--line);padding-top:14px} .appfoot b{color:var(--green-d)}
  .contact-btn{background:var(--card);border:1.5px solid var(--green);color:var(--green-d);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:8px;margin-bottom:10px;cursor:pointer}
  @media(min-width:740px){
    body{background:var(--cream)} #phone{max-width:900px;box-shadow:0 0 0 1px var(--line)}
    #hdr{padding:18px 30px 16px} header h1{font-size:20px}
    nav{height:60px;padding:0 16px} nav button{flex-direction:row;font-size:15px;gap:9px} nav .ico{font-size:20px}
    main{padding:24px 36px 40px}
  }
</style>
</head>
<body>
<div id="phone">
  <div id="login">
    <div id="loginLogo" style="margin-bottom:6px"></div>
    <div style="font-family:Georgia,serif;font-size:25px;font-weight:700;letter-spacing:1px;color:#fff">ESCALERA PILAR</div>

    <div class="loginbox">
      <div class="err" id="loginErr"></div>

    </div>

    <button id="nav-escalera" class="active" onclick="go('escalera')"><span class="ico">🪜</span>Ranking</button>

  </nav>
  <main class="hidden" id="main"></main>
  <div id="modal" class="hidden"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://ywwkzpfoeextwiwzgxwj.supabase.co";
const SB_KEY="sb_publishable_erJOFLHirh3AhSWv84mAiw_EWOWWX0A";
const sb=supabase.createClient(SB_URL,SB_KEY);
const APP_URL="https://escalera-pilar.vercel.app";
const ADMIN_WSP="5491169051186";

const DEFAULT_BARRIOS=["Mayling","Lagartos","Ayres","Ayres Plaza","Mapuche","Tortugas","Las Liebres"];
const NIVELES=["Primera","Segunda A","Segunda B","Tercera A","Tercera B"];
const CATS=[{name:"Primera",color:"var(--cat-primera)",cum:0.15,pct:"15% sup."},{name:"Segunda A",color:"var(--cat-sega)",cum:0.40,pct:"25%"},{name:"Segunda B",color:"var(--cat-segb)",cum:0.65,pct:"25%"},{name:"Tercera",color:"var(--cat-tercera)",cum:1.00,pct:"35% inf."}];
const UNAVAIL_BLOCKS=[{k:'semana',l:'Semana (lun a vie)'},{k:'sab_m',l:'Sábado mañana'},{k:'sab_t',l:'Sábado tarde (15-17)'},{k:'sab_n',l:'Sábado noche (18-19)'},{k:'dom_m',l:'Domingo mañana'},{k:'dom_t',l:'Domingo tarde (15-17)'},{k:'dom_n',l:'Domingo noche (18-19)'}];
const DAYS=['dom','lun','mar','mié','jue','vie','sáb'];
let S={all:[],players:[],pending:[],challenges:[],history:[],likes:{},comments:{},config:{}};
let meId=null, view='escalera', viewingId=null;

/* ---------- helpers ---------- */
const P=id=>S.all.find(p=>p.id===id);
const me=()=>P(meId);
const byPos=()=>[...S.players].sort((a,b)=>a.pos-b.pos);
const fn=p=>p?p.name.split(' ')[0]:'—';
const pad=n=>String(n).padStart(2,'0');
function ageOf(dob){ if(!dob)return '–'; const d=new Date(dob),t=new Date(); let a=t.getFullYear()-d.getFullYear(); const m=t.getMonth()-d.getMonth(); if(m<0||(m===0&&t.getDate()<d.getDate()))a--; return a; }
const ACTIVE=['esperando_horarios','esperando_eleccion','aceptado'];
const activeChallenges=()=>S.challenges.filter(c=>ACTIVE.includes(c.status));
const openChallengesFor=id=>activeChallenges().filter(c=>c.fromId===id||c.toId===id);
const isBusy=id=>openChallengesFor(id).length>0;
function catOf(pos){ const N=S.players.length||1; const cum=[0.15,0.40,0.65,1.0]; let cuts=[],prev=0; for(let i=0;i<4;i++){ let c=Math.ceil(cum[i]*N); if(i+1<=N)c=Math.max(c,i+1); c=Math.max(c,prev); c=Math.min(c,N); cuts.push(c); prev=c; } for(let i=0;i<4;i++){ if(pos<=cuts[i])return CATS[i]; } return CATS[3]; }
function nameLink(p){ return p?`<b class="clk" onclick="openPlayer('${p.id}')">${p.name}</b>`:'—'; }
function blockLabel(k){ const b=UNAVAIL_BLOCKS.find(x=>x.k===k); return b?b.l:k; }
function blockOfSlot(s){ const d=new Date(s),day=d.getDay(),h=d.getHours(); if(day>=1&&day<=5)return 'semana'; const pre=day===6?'sab':'dom'; if(h<12)return pre+'_m'; if(h<17)return pre+'_t'; return pre+'_n'; }
function slotOk(s){ if(!s)return false; const d=new Date(s); if(isNaN(d))return false; const day=d.getDay(),h=d.getHours(); if(day===0||day===6)return (h>=9&&h<12)||(h>=15&&h<19); return h>=18; }
function isWeekend(s){ const d=new Date(s); return d.getDay()===0||d.getDay()===6; }
function fmtDT(s){ if(!s)return ''; const d=new Date(s); return `${DAYS[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function argISO(dtLocal){ return dtLocal?dtLocal+':00-03:00':dtLocal; }
function challengeInfo(meP,t){ if(t.id===meP.id)return{ok:false}; if(t.pos>=meP.pos)return{ok:false,reason:'abajo'}; if(isBusy(meP.id))return{ok:false,reason:'vos-ocupado'}; if(isBusy(t.id))return{ok:false,reason:'ocupado'}; const gap=meP.pos-t.pos; if(gap<=2)return{ok:true,needsWC:false}; if(meP.wildCards>0)return{ok:true,needsWC:true}; return{ok:false,reason:'fuera'}; }
function waLink(t,txt){ return `https://wa.me/${(t.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`; }
function barrios(){ const b=(S.config.barrios||'').split(',').filter(Boolean); return b.length?b:DEFAULT_BARRIOS; }
function wspGroup(){ return S.config.wsp_group||'#'; }
function contactAdmin(){ window.open(`https://wa.me/${ADMIN_WSP}?text=`+encodeURIComponent('Hola, te escribo por Escalera Pilar 🎾: '),'_blank'); }
function addToCalendar(chId){ const c=S.challenges.find(x=>x.id===chId); if(!c||!c.playDate)return; const other=P(c.fromId===meId?c.toId:c.fromId); const st=new Date(c.playDate),en=new Date(st.getTime()+90*60000); const z=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EscaleraPilar//ES','BEGIN:VEVENT','UID:esc-'+c.id+'@escalerapilar','DTSTAMP:'+z(new Date()),'DTSTART:'+z(st),'DTEND:'+z(en),'SUMMARY:🎾 Partido Escalera Pilar vs '+(other?other.name:''),'LOCATION:'+(c.playPlace||''),'DESCRIPTION:Escalera Pilar - '+APP_URL,'END:VEVENT','END:VCALENDAR'].join('\r\n'); const a=document.createElement('a'); a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics); a.download='partido-escalera.ics'; a.click(); }
function disputeMatch(){ window.open(`https://wa.me/${ADMIN_WSP}?text=`+encodeURIComponent(`Hola, soy ${me().name}. Quiero impugnar un resultado en Escalera Pilar 🎾. Detalle: `),'_blank'); }

/* ---------- AUTH ---------- */
async function doSignup(){
  const e=document.getElementById('suErr'); e.textContent='';
  const email=val('suEmail'),pass=val('suPass'),name=val('suName'),dob=val('suDob'),phone=val('suPhone'),barrio=val('suBarrio'),level=val('suLevel');
  const unavail=getUnavail('suUnavail');
  if(!email||!pass){e.textContent='Completá email y contraseña.';return;}
  if(pass.length<6){e.textContent='La contraseña debe tener al menos 6 caracteres.';return;}
  if(!name||!phone||!dob){e.textContent='Completá nombre, celular y fecha de nacimiento.';return;}
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name,phone,dob,barrio,level,unavail}}});
  if(error){e.textContent=error.message;return;}
  await boot();
}
async function doLogin(){
  const e=document.getElementById('loginErr'); e.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:val('liEmail'),password:val('liPass')});
  if(error){ e.textContent = /confirm/i.test(error.message)?'Falta confirmar el email. Desactivá la confirmación en Supabase (ver instrucciones).':error.message; return; }
  await boot();
}
async function doLogout(){ await sb.auth.signOut(); meId=null; location.reload(); }

/* ---------- CARGA DE DATOS ---------- */
async function refresh(){
  try{ await sb.rpc('run_sweeps'); }catch(e){}
  const [pr,ch,ma,lk,cm,cf]=await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('challenges').select('*'),
    sb.from('matches').select('*').order('played_at',{ascending:true}),
    sb.from('likes').select('*'),
    sb.from('comments').select('*').order('created_at',{ascending:true}),
    sb.from('config').select('*'),
  ]);
  const mapP=p=>({id:p.id,name:p.name,phone:p.phone||'',dob:p.dob,barrio:p.barrio,level:p.level,pos:p.pos,bestPos:p.best_pos,wildCards:p.wild_cards,wcStreak:p.wc_streak,rejThisMonth:p.rej_this_month,lastRejTarget:p.last_rej_target,lastPlayed:p.last_played,unavail:p.unavail||[],isAdmin:p.is_admin,approved:p.approved});
  S.all=(pr.data||[]).map(mapP);
  S.players=S.all.filter(p=>p.approved&&p.pos!=null);
  S.pending=S.all.filter(p=>!p.approved);
  S.challenges=(ch.data||[]).map(c=>({id:c.id,fromId:c.from_id,toId:c.to_id,usedWC:c.used_wc,status:c.status,outcome:c.outcome,slots:c.slots,playDate:c.play_date,playPlace:c.play_place,createdTs:new Date(c.created_at).getTime()}));
  S.history=(ma.data||[]).map(m=>({winnerId:m.winner_id,loserId:m.loser_id,score:m.score,swapped:m.swapped,spots:m.spots,moverId:m.mover_id,wc:m.used_wc,type:m.type,ts:new Date(m.played_at).getTime(),date:new Date(m.played_at).toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}));
  S.likes={}; (lk.data||[]).forEach(l=>{(S.likes[l.post_id]=S.likes[l.post_id]||[]).push(l.user_id);});
  S.comments={}; (cm.data||[]).forEach(c=>{(S.comments[c.post_id]=S.comments[c.post_id]||[]).push({by:c.user_id,text:c.body,ts:new Date(c.created_at).getTime()});});
  S.config={}; (cf.data||[]).forEach(c=>{S.config[c.key]=c.value;});
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ showScreen('login'); return; }
  meId=session.user.id;
  await refresh();
  let m=me();
  if(!m){ await new Promise(r=>setTimeout(r,800)); await refresh(); m=me(); }
  renderBarriosLine();
  if(!m){ showScreen('login'); return; }
  if(!m.approved){ document.getElementById('pendLogo').innerHTML=escudoMini(60); document.getElementById('pendWsp').onclick=()=>window.open(wspGroup(),'_blank'); showScreen('pending'); return; }
  showScreen('app'); go('escalera');
}
function showScreen(s){
  ['login','signup','pending'].forEach(i=>document.getElementById(i).classList.add('hidden'));
  ['hdr','main','nav'].forEach(i=>document.getElementById(i).classList.add('hidden'));
  if(s==='app'){ ['hdr','main','nav'].forEach(i=>document.getElementById(i).classList.remove('hidden')); }
  else document.getElementById(s).classList.remove('hidden');
}
function showSignup(){ document.getElementById('suBarrio').innerHTML=barrios().map(b=>`<option>${b}</option>`).join(''); document.getElementById('suLevel').innerHTML=NIVELES.map(n=>`<option>${n}</option>`).join(''); unavailCheckboxes('suUnavail',[]); showScreen('signup'); }
function hideSignup(){ showScreen('login'); }
function renderBarriosLine(){ const el=document.getElementById('barriosLine'); const u=[...new Set(S.players.map(p=>p.barrio).filter(Boolean))]; el.innerHTML=`<b>${(u.length?u:barrios()).join(' · ')}</b>`; }
const val=id=>document.getElementById(id).value.trim();
function unavailCheckboxes(cid,checked){ document.getElementById(cid).innerHTML=UNAVAIL_BLOCKS.map(b=>`<label class="chk"><input type="checkbox" style="width:18px;flex:0 0 auto;margin:0" value="${b.k}" ${checked&&checked.includes(b.k)?'checked':''} onchange="limitUnavail('${cid}')"> ${b.l}</label>`).join(''); }
function limitUnavail(cid){ const ch=[...document.querySelectorAll('#'+cid+' input')].filter(b=>b.checked); if(ch.length>2){event.target.checked=false;toast('Máximo 2 bloques');} }
function getUnavail(cid){ return [...document.querySelectorAll('#'+cid+' input:checked')].map(b=>b.value); }

/* ---------- NAV / RENDER ---------- */
const NAVS=['escalera','desafios','feed','stats','perfil'];
function go(v){ view=v; NAVS.forEach(n=>document.getElementById('nav-'+n).classList.toggle('active',n===v)); render(); }
function openPlayer(id){ if(id===meId){go('perfil');return;} viewingId=id; view='jugador'; NAVS.forEach(n=>document.getElementById('nav-'+n).classList.toggle('active',n==='escalera')); render(); }
function goReglas(){ view='reglas'; NAVS.forEach(n=>document.getElementById('nav-'+n).classList.toggle('active',n==='perfil')); render(); }
function footer(){ return `<div class="appfoot"><p><a onclick="contactAdmin()" style="color:var(--green-d);cursor:pointer;text-decoration:underline">Contactar al administrador</a></p></div>`; }
function render(){
  const m=me(); if(!m)return;
  document.getElementById('hdrSub').textContent=`${S.players.length} jugadores · escalera permanente`;
  document.getElementById('meChip').innerHTML=`<span>👤</span> #${m.pos} · ${fn(m)}`;
  const open=openChallengesFor(meId).length;
  const nd=document.getElementById('nav-desafios'); nd.querySelector('.badge')?.remove();
  if(open>0){const b=document.createElement('span');b.className='badge';b.textContent=open;nd.appendChild(b);}
  let c;
  if(view==='escalera')c=viewEscalera(); else if(view==='desafios')c=viewDesafios(); else if(view==='feed')c=viewFeed();
  else if(view==='stats')c=viewStats(); else if(view==='jugador')c=viewJugador(); else if(view==='reglas')c=viewReglas(); else c=viewPerfil();
  document.getElementById('main').innerHTML=c+footer();
}

/* ---------- STATS helpers ---------- */
function playerStats(id){ const recs=S.history.filter(h=>h.winnerId===id||h.loserId===id); const played=recs.length,won=recs.filter(h=>h.winnerId===id).length,lost=played-won,pct=played?Math.round(won/played*100):0; let streak={type:null,n:0}; for(let i=S.history.length-1;i>=0;i--){const h=S.history[i]; if(h.winnerId!==id&&h.loserId!==id)continue; const w=h.winnerId===id; if(streak.n===0)streak={type:w?'W':'L',n:1}; else if((streak.type==='W')===w)streak.n++; else break;} return {played,won,lost,pct,streak}; }
function streakLabel(s){ if(!s.n)return '–'; return s.type==='W'?`${s.n} 🔥`:`${s.n} ❄️`; }
function recShort(st){ return `G${st.won} P${st.lost}${st.played?' · '+st.pct+'%':''}${st.streak.n?' · '+(st.streak.type==='W'?'🔥':'❄️')+st.streak.n:''}`; }
function historyRows(filterId){ let h=[...S.history]; if(filterId)h=h.filter(x=>x.winnerId===filterId||x.loserId===filterId); if(!h.length)return `<div class="empty" style="padding:24px"><span class="ico">📜</span>Sin partidos todavía.</div>`; return h.reverse().map(x=>{const w=P(x.winnerId),l=P(x.loserId),moved=x.swapped?` · ${fn(w)} subió 🔺`:'',ico=x.type==='walkover'?'⚠️':'🎾'; return `<div class="hrow"><div class="h-ico">${ico}</div><div class="h-main"><div class="h-res">${nameLink(w)} le ganó a ${nameLink(l)}</div><div class="h-sub">${x.date}${moved}${x.wc?' · ★ wild card':''}</div></div><div class="h-score">${x.score}</div></div>`;}).join(''); }

/* ---------- VIEWS ---------- */
function viewEscalera(){
  const m=me(),myCat=catOf(m.pos),busy=isBusy(m.id); let html='',lastCat=null;
  byPos().forEach(p=>{ const cat=catOf(p.pos),st=playerStats(p.id);
    if(cat.name!==lastCat){html+=`<div class="band" style="background:${cat.color}">${cat.name}<span class="pct">${cat.pct}</span></div>`;lastCat=cat.name;}
    const isMe=p.id===meId,posCls=p.pos===1?'pos crown':'pos'; let right='';
    if(!isMe){ const ci=challengeInfo(m,p);
      if(ci.ok&&ci.needsWC)right=`<button class="challenge-btn wc" onclick="askChallenge('${p.id}',true)">★ Wild</button>`;
      else if(ci.ok)right=`<button class="challenge-btn" onclick="askChallenge('${p.id}',false)">Desafiar</button>`;
      else if(ci.reason==='ocupado')right=`<span class="lock">⏳ ocupado</span>`;
      else if(ci.reason==='fuera')right=`<span class="lock">🔒</span>`; else right=`<span class="lock">—</span>`;
    } else right=`<span class="tag you">VOS</span>`;
    html+=`<div class="lrow ${isMe?'me':''}" style="border-left-color:${cat.color}"><div class="${posCls}">${p.pos}</div><div class="pinfo clk" onclick="openPlayer('${p.id}')"><div class="pname">${p.name} <span style="font-size:11px;color:var(--muted)">›</span></div><div class="plevel"><span class="barrio">${p.barrio||''}</span> ${ageOf(p.dob)}a <span class="rec">${recShort(st)}</span></div></div>${right}</div>`;
  });
  const banner=busy?`<div class="banner">Tenés un desafío activo. Resolvelo para iniciar otro.</div>`:'';
  return `<div class="section-title">Tu posición</div><div class="stat-grid" style="margin-bottom:12px"><div class="stat"><div class="n">#${m.pos}</div><div class="l">Puesto</div></div><div class="stat"><div class="n" style="font-size:14px;color:${myCat.color};padding-top:5px">${myCat.name}</div><div class="l">Categoría</div></div><div class="stat"><div class="n">${m.wildCards}</div><div class="l">Wild cards</div></div></div>${banner}<div class="section-title">El ranking general</div><div class="card">${html}</div><div class="note">Podés desafiar hasta 2 puestos por encima. Para más, usá una ★ wild card.</div>`;
}
function chLabel(c){ if(c.status==='aceptado')return '<span class="badge-state acc">Aceptado</span>'; if(c.status==='done')return c.outcome==='rechazado'?'<span class="badge-state rej">Rechazado</span>':'<span class="badge-state play">Jugado</span>'; return '<span class="badge-state pend">Pendiente</span>'; }
function viewDesafios(){
  const mine=S.challenges.filter(c=>c.fromId===meId||c.toId===meId);
  const active=mine.filter(c=>ACTIVE.includes(c.status)).sort((a,b)=>b.createdTs-a.createdTs);
  const done=mine.filter(c=>c.status==='done').sort((a,b)=>b.createdTs-a.createdTs);
  let html=`<div class="section-title">Tus desafíos</div>`;
  html+=active.length?`<div class="card">`+active.map(challengeCard).join('')+`</div>`:`<div class="card"><div class="empty"><span class="ico">⚔️</span>No tenés desafíos activos.<br>Andá al ranking y desafiá a alguien.</div></div>`;
  html+=`<div class="section-title">Tu historial de desafíos</div>`;
  html+=done.length?`<div class="card"><div class="scrolllist">`+done.map(c=>{const o=P(c.fromId===meId?c.toId:c.fromId);return `<div class="hrow"><div class="h-ico">${c.outcome==='jugado'?'🎾':(c.outcome==='walkover'?'⚠️':'✕')}</div><div class="h-main"><div class="h-res">vs ${nameLink(o)}</div><div class="h-sub">${c.outcome==='rechazado'?'Rechazado':(c.outcome==='walkover'?'W.O.':'Jugado')}${c.playDate?' · '+fmtDT(c.playDate):''}</div></div></div>`;}).join('')+`</div></div>`:`<div class="card"><div class="empty"><span class="ico">📜</span>Todavía no tenés desafíos resueltos.</div></div>`;
  html+=`<button class="reglink" style="color:#b3471f;border-color:#d8a78f;margin-top:8px" onclick="disputeMatch()">⚠️ Impugnar un resultado ›</button>`;
  return html;
}
function challengeCard(c){
  const amCha=c.fromId===meId,other=P(amCha?c.toId:c.fromId); let meta='',date='',actions='';
  if(c.status==='aceptado'){ date=`<div class="ch-date">🗓️ Juegan: ${fmtDT(c.playDate)}${c.playPlace?' · '+c.playPlace:''}</div>`; meta=`${amCha?'Desafiaste a':'Te desafió'} ${nameLink(other)} (#${other.pos}).${c.usedWC?' <span class="pill">★ wild</span>':''}`; actions=`<button class="act win" onclick="scoreModal(${c.id})">Cargar resultado</button><button class="act acc" onclick="addToCalendar(${c.id})">📅 Agendar</button><button class="act wa" onclick="waCoordinate(${c.id})">📲 WhatsApp</button>`; }
  else if(c.status==='esperando_horarios'){ const hs=Math.max(0,Math.ceil((c.createdTs+48*3600000-Date.now())/3600000));
    if(amCha){meta=`Desafiaste a ${nameLink(other)} (#${other.pos}). Esperando que proponga 2 horarios (le quedan ~${hs} h).`;actions=`<button class="act wa" onclick="waChallenge('${other.id}')">📲 Recordar por WhatsApp</button>`;}
    else{meta=`${nameLink(other)} (#${other.pos}) te desafió. Tenés <b>~${hs} h</b> para responder (el silencio se considera rechazo).`;actions=`<button class="act acc" onclick="proposeModal(${c.id})">Aceptar y proponer fechas</button><button class="act rej" onclick="reject(${c.id})">Rechazar</button>`;}
  } else if(c.status==='esperando_eleccion'){
    if(amCha){meta=`${nameLink(other)} propuso 2 opciones. Elegí una:`;actions=c.slots.map((s,i)=>`<button class="act acc" onclick="pickSlot(${c.id},${i})">${fmtDT(s.dt)} · ${s.place}</button>`).join('');}
    else{meta=`Propusiste 2 opciones a ${nameLink(other)}. Esperando que elija.`;date=`<div class="ch-date">Opciones: ${c.slots.map(s=>fmtDT(s.dt)+' ('+s.place+')').join(' · ')}</div>`;actions=`<button class="act wa" onclick="waRemindChoice(${c.id})">📲 Recordar</button>`;}
  }
  return `<div class="ch"><div class="ch-top"><span class="ch-who">vs ${other.name}</span>${chLabel(c)}</div>${date}<div class="ch-meta">${meta}</div><div class="ch-actions">${actions}</div></div>`;
}
function timeAgo(ts){ if(!ts)return''; const s=(Date.now()-ts)/1000; if(s<60)return'recién'; if(s<3600)return Math.floor(s/60)+' min'; if(s<86400)return Math.floor(s/3600)+' h'; return Math.floor(s/86400)+' d'; }
function socialBar(pid){ const likes=S.likes[pid]||[],comments=S.comments[pid]||[],liked=likes.includes(meId); const clist=comments.length?`<div class="comments">`+comments.map(c=>`<div class="comment">${nameLink(P(c.by))}: ${c.text}</div>`).join('')+`</div>`:''; return `<div class="post-actions"><button class="${liked?'liked':''}" onclick="likePost('${pid}')">${liked?'♥':'♡'} ${likes.length||''} Me gusta</button><button onclick="commentModal('${pid}')">💬 ${comments.length||''} Comentar</button></div>${clist}`; }
function viewFeed(){
  const last5=[...S.history].reverse().slice(0,5);
  const res=last5.length?last5.map(h=>{const pid='res-'+h.ts,w=P(h.winnerId),l=P(h.loserId);return `<div class="post"><div class="post-top"><div class="post-ico res">${h.type==='walkover'?'⚠️':'🎾'}</div><div class="post-body"><div>${nameLink(w)} le ganó a ${nameLink(l)}${h.swapped?` y subió a #${w.pos}`:''}</div><div class="post-when">${h.date} · ${timeAgo(h.ts)}</div></div><div class="post-score">${h.score}</div></div>${socialBar(pid)}</div>`;}).join(''):`<div class="empty"><span class="ico">🎾</span>Sin resultados todavía.</div>`;
  const acts=activeChallenges();
  const ch=acts.length?acts.slice().reverse().map(c=>{const pid='ch-'+c.id,a=P(c.fromId),b=P(c.toId);return `<div class="post"><div class="post-top"><div class="post-ico chal">⚔️</div><div class="post-body"><div>${nameLink(a)} desafió a ${nameLink(b)}</div><div class="post-when">#${a.pos} vs #${b.pos}${c.status==='aceptado'?' · juegan '+fmtDT(c.playDate):''} · ${timeAgo(c.createdTs)}</div></div>${chLabel(c)}</div>${socialBar(pid)}</div>`;}).join(''):`<div class="empty"><span class="ico">⚔️</span>No hay desafíos activos.</div>`;
  const hd=S.challenges.filter(c=>c.status==='done');

function topRows(arr){ return arr.length?arr.map((x,i)=>`<div class="hrow"><div class="rank-n">${i+1}</div><div class="h-main"><div class="h-res">${nameLink(x.p)}</div><div class="h-sub">${x.sub}</div></div><div class="h-score">${x.val}</div></div>`).join(''):`<div class="empty" style="padding:20px">Sin datos aún.</div>`; }
function viewStats(){
  const champs=CATS.map(cat=>{const inCat=byPos().filter(p=>catOf(p.pos).name===cat.name),leader=inCat[0];return `<div class="hrow"><div class="h-ico" style="background:${cat.color};color:#fff">👑</div><div class="h-main"><div class="h-res" style="color:${cat.color}">${cat.name}</div><div class="h-sub">${leader?nameLink(leader)+' · #'+leader.pos:'sin jugadores'}</div></div></div>`;}).join('');

function checkSlotLive(n){ const el=document.getElementById('slot'+n),msg=document.getElementById('slot'+n+'msg'),v=el.value; if(!v){msg.textContent='';return;} const c=S.challenges.find(x=>x.id===proposeCtx.chId),cha=P(c.fromId),un=cha.unavail||[],now=Date.now(),t=new Date(v).getTime(),max=now+10*86400000; let err=''; if(!slotOk(v))err='Fuera de las ventanas válidas.'; else if(t<now)err='Es una fecha pasada.'; else if(t>max)err='Fuera de los próximos 10 días.'; else if(un.includes(blockOfSlot(v)))err=`${fn(cha)} no puede jugar en ese horario (${blockLabel(blockOfSlot(v))}).`; if(err){msg.style.color='#b3471f';msg.innerHTML='✗ '+err;} else {msg.style.color='#155c39';msg.innerHTML='✓ Horario válido'+(isWeekend(v)?' · fin de semana':'');} }
async function submitSlots(chId){ const c=S.challenges.find(x=>x.id===chId),cha=P(c.fromId),un=cha.unavail||[]; const s1=val('slot1'),s2=val('slot2'),p1=val('place1'),p2=val('place2'),e=document.getElementById('slotErr');

  <div class="opt" style="margin-bottom:14px"><button class="act win" onclick="setWinner(${chId},'${cha.id}',false)">Ganó ${fn(cha)}</button><button class="act acc" onclick="setWinner(${chId},'${def.id}',false)">Ganó ${fn(def)}</button></div>
  <hr class="divider"><label>¿No se presentó alguien? W.O. (6-0 6-0)</label><div class="opt"><button class="act lose" onclick="setWinner(${chId},'${cha.id}',true)">${fn(cha)} por W.O.</button><button class="act lose" onclick="setWinner(${chId},'${def.id}',true)">${fn(def)} por W.O.</button></div>`); }
async function setWinner(chId,winnerId,wo){ let score='6-0 6-0'; if(!wo){ const g=id=>(document.getElementById(id).value||'').trim(); const parts=[]; [['s1a','s1b'],['s2a','s2b'],['s3a','s3b']].forEach(([a,b])=>{const va=g(a),vb=g(b); if(va!==''&&vb!=='')parts.push(va+'-'+vb);}); if(parts.length<2){toast('Cargá al menos los 2 sets');return;} score=parts.join(' '); } const {error}=await sb.rpc('resolve_match',{p_challenge:chId,p_winner:winnerId,p_score:score,p_wo:wo}); closeModal(); if(error){toast(error.message);return;} toast('Resultado cargado ✅'); await refresh(); render(); }
function reject(chId){ const c=S.challenges.find(x=>x.id===chId),def=me(),cha=P(c.fromId);
  if(def.lastRejTarget===cha.id){ modal(`<h3>No podés rechazar</h3><p>Ya rechazaste a ${cha.name} la vez anterior: este desafío hay que jugarlo.</p><button class="act win" onclick="closeModal()">Entendido</button>`); return; }
  if(def.rejThisMonth>=1){ modal(`<h3>Segundo rechazo del mes</h3><p>Ya usaste tu rechazo libre. Si rechazás, contás como derrota y ${cha.name} te toma el puesto.</p><div class="opt"><button class="act lose" onclick="closeModal()">Mejor juego</button><button class="act rej" onclick="doReject(${chId})">Rechazar igual</button></div>`); return; }
  doReject(chId); }
async function doReject(chId){ const {error}=await sb.rpc('reject_challenge',{p_challenge:chId}); closeModal(); if(error){toast(error.message);return;} toast('Desafío rechazado'); await refresh(); render(); }
async function likePost(pid){ const arr=S.likes[pid]||[]; if(arr.includes(meId)) await sb.from('likes').delete().eq('post_id',pid).eq('user_id',meId); else await sb.from('likes').insert({post_id:pid,user_id:meId}); await refresh(); render(); }
function commentModal(pid){ modal(`<h3>Comentar</h3><textarea id="cmt" placeholder="Escribí algo..."></textarea><div class="opt"><button class="act lose" onclick="closeModal()">Cancelar</button><button class="act win" onclick="addComment('${pid}')">Publicar</button></div>`); }
async function addComment(pid){ const t=(document.getElementById('cmt').value||'').trim(); if(!t){closeModal();return;} await sb.from('comments').insert({post_id:pid,user_id:meId,body:t}); closeModal(); toast('Comentario publicado 💬'); await refresh(); render(); }

/* ---------- UTILS ---------- */
function modal(html){ const m=document.getElementById('modal'); m.innerHTML=`<div class="sheet">${html}</div>`; m.classList.remove('hidden'); m.onclick=e=>{if(e.target===m)closeModal();}; }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
let toastT; function toast(msg){ clearTimeout(toastT); document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.getElementById('phone').appendChild(t); toastT=setTimeout(()=>t.remove(),2600); }

/* ---------- INIT ---------- */
document.getElementById('loginLogo').innerHTML=escudoFull(150);
document.getElementById('hdrLogo').innerHTML=escudoMini(34);
boot();
</script>
